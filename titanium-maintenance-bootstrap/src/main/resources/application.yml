server:
  port: 8083
  servlet:
    context-path: /maintenance

spring:
  application:
    name: titanium-maintenance
  profiles:
    active: dev
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:8066/titanium_maintenance?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # ⚠️ 本段不被 Spring 消费：本仓未引入 spring-boot-kafka（KafkaProperties 所在模块），
      #    Boot 的 Kafka 自动配置不激活，这里的 serializer 一律不生效。生产者参数的唯一事实来源是
      #    infrastructure 的 KafkaConfig#producerFactory（已显式置 acks=all / enable.idempotence / retries）。
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: maintenance-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.titanium.maintenance.*
  # 事务配置
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Liquibase配置（DDL 交由 liquibase 管理）
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml

jwt:
  secret: ${JWT_SECRET:titanium-admin-jwt-secret-key-2026-must-be-at-least-32-chars}

maintenance:
  authentication:
    enabled: true
    internal-token: ${MAINTENANCE_INTERNAL_TOKEN:change-me-in-production-maintenance-internal-token}

# Axon Framework配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      # ⚠️ 死配置（m6-909 实读登记，未改）：全仓无任何处理器声明组名 maintenance，本段不生效。
      #    真实的读侧组名是 maintenance-query-group（见 MaintenanceProjectionEventHandler 等 8 处的
      #    @ProcessingGroup），该组当前**未配置任何 axon.eventhandling.processors 键**。
      maintenance:
        mode: subscribing
        threadCount: 4
      # 跨域出站处理组（处理者是 MaintenanceKafkaEventPublisher）：tracking + DLQ，发布失败的事件由
      # DeadLetterQueueService 定时重投。组名须与 MaintenanceKafkaEventPublisher.PROCESSING_GROUP 一致。
      maintenance-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
        batchSize: 1
  eventstore:
    event-serializer: jackson
    snapshot-serializer: jackson

# 日志配置
logging:
  level:
    root: INFO
    com.titanium.maintenance: DEBUG
    org.springframework: INFO
    org.axonframework: DEBUG

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
  hystrix:
    enabled: false

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

titanium:
  axon:
    # 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
    # 并令其首启位点取事件流末端（避免首次部署重放全量历史保全事件）。
    outbound-relay:
      groups: [maintenance-kafka-group]
  maintenance:
    # 旧版 POST /web|api/v1/maintenances 建案兼容开关；关闭后查询和案件后续操作仍可用
    legacy-creation-enabled: true
    # 旧版 POST /web/v1/maintenances/{id}/calculate-premium 人工金额写入开关；稳定期默认兼容
    legacy-premium-calculation-enabled: true
    # 旧版 POST /web/v1/maintenances/{id}/execute 整案执行开关；关闭后统一使用独立案件任务级生效。
    # 通道按案件代数互斥（D9）：independent_case=true 的独立建案即使在开关开启时也会被拒绝（409），
    # 本入口只服务 independent_case=false 的历史案件，避免同一保单被新旧两条通道重复施加
    legacy-execution-enabled: true
    configuration:
      # 灰度回滚开关：关闭时禁止新建、创建修订版和首次发布，查询保持可用
      write-enabled: true
